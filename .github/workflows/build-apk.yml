name: Build APK Berkah ASMR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Cek file proyek
        run: |
          ls -la
          ls -R app | head -50
          test -f settings.gradle || { echo "::error::settings.gradle tidak ada"; exit 1; }
          test -f app/build.gradle || { echo "::error::app/build.gradle tidak ada"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml tidak ada"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BerkahASMR.apk

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: BerkahASMR-APK
          path: BerkahASMR.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" BerkahASMR.apk \
            --title "Berkah ASMR v1.0.${{ github.run_number }}" \
            --notes "APK dibuat otomatis oleh GitHub Actions. Download BerkahASMR.apk di bawah, lalu buka di HP Android untuk menginstal."
